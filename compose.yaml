# Stack de desenvolvimento: Postgres, MinIO e a API.
# Staging e production não usam este arquivo; lá DATABASE_URL e S3_* vêm do ambiente.
name: implante-flow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: implante
      POSTGRES_PASSWORD: implante
      POSTGRES_DB: implante_flow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U implante -d implante_flow"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: implante
      MINIO_ROOT_PASSWORD: implante-dev-key
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/data

  minio-setup:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 implante implante-dev-key; do
          sleep 1
        done
        mc mb --ignore-existing local/implante-flow

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://implante:implante@postgres:5432/implante_flow
      S3_BUCKET: implante-flow
      S3_REGION: sa-east-1
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: implante
      S3_SECRET_ACCESS_KEY: implante-dev-key
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully

volumes:
  postgres:
  minio:
