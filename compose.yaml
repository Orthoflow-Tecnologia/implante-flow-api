# Postgres e MinIO para desenvolvimento. A API não entra aqui:
# staging e production recebem DATABASE_URL e S3_* pelo ambiente.
name: implante-flow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: implante
      POSTGRES_PASSWORD: implante
      POSTGRES_DB: implante_flow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U implante -d implante_flow"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: implante
      MINIO_ROOT_PASSWORD: implante-dev-key
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/data

  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 implante implante-dev-key; do
          sleep 1
        done
        mc mb --ignore-existing local/implante-flow

volumes:
  postgres:
  minio:
